# ---------------------------------------------------------------------------
# Redline – Docker Compose deployment
#
# ⚡ Hostinger HPanel deployment
#   1. Push code to GitHub – GitHub Actions builds & pushes the image to GHCR.
#   2. In HPanel → Docker Manager: enter GitHub URL + this file.
#   3. Create/upload .env via HPanel File Manager (see .env.example).
#   4. Deploy.
#
# 💻 Local / SSH deployment (with local build)
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Grafana: http://localhost:3000  (admin / see GRAFANA_ADMIN_PASSWORD in .env)
# Metrics: http://localhost:8000/metrics
# Health:  http://localhost:8000/healthz
# ---------------------------------------------------------------------------

services:

  # ── Flask Application ─────────────────────────────────────────────────────
  redline:
    # Image is built automatically by GitHub Actions and pushed to GHCR.
    # For local builds use docker-compose.build.yml overlay instead.
    image: ghcr.io/kwieser76/redline-:latest
    container_name: redline_app
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8000}:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: "sqlite:////app/data/redline.db"
      FLASK_ENV: "production"

    volumes:
      - redline_data:/app/data
      - redline_qrcodes:/app/static/qrcodes

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: redline_prometheus
    restart: unless-stopped

    # Bound to localhost only – not publicly reachable.
    # Remove the "127.0.0.1:" prefix if you need external access (secure with firewall!).
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

    depends_on:
      redline:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: redline_grafana
    restart: unless-stopped

    # Bound to localhost only – not publicly reachable.
    # Remove the "127.0.0.1:" prefix if you need external access (secure with firewall!).
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      # No fallback – GRAFANA_ADMIN_PASSWORD must be set in .env
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/redline.json"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ---------------------------------------------------------------------------
# Named volumes – data persists across container restarts
# ---------------------------------------------------------------------------

volumes:
  redline_data:
    driver: local
  redline_qrcodes:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
