# ---------------------------------------------------------------------------
# Redline – Docker Compose deployment
#
# ⚡ Hostinger HPanel deployment
#   1. Push code to GitHub – GitHub Actions builds & pushes the image to GHCR.
#   2. In HPanel → Docker Manager: enter GitHub URL + this file.
#   3. Create/upload .env via HPanel File Manager (see .env.example).
#   4. Deploy.
#
# 💻 Local / SSH deployment (with local build)
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Grafana: http://localhost:3000  (admin / see GRAFANA_ADMIN_PASSWORD in .env)
# Metrics: http://localhost:8000/metrics
# Health:  http://localhost:8000/healthz
#
# NOTE: Prometheus and Grafana configs are embedded inline in the command
# blocks below so this file is fully self-contained and works on HPanel
# without needing the ./prometheus/ or ./grafana/ directories on the host.
# ---------------------------------------------------------------------------

services:

  # ── Flask Application ─────────────────────────────────────────────────────
  redline:
    # Image is built automatically by GitHub Actions and pushed to GHCR.
    # For local builds use docker-compose.build.yml overlay instead.
    image: ghcr.io/kwieser76/redline:latest
    container_name: redline_app
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8000}:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: "sqlite:////app/data/redline.db"
      FLASK_ENV: "development"

    volumes:
      - redline_data:/app/data
      - redline_qrcodes:/app/static/qrcodes

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Prometheus ────────────────────────────────────────────────────────────
  # Config is written inline by the entrypoint script so no bind mount to
  # ./prometheus/prometheus.yml is needed (avoids the Docker "dir instead
  # of file" trap when the host directory does not pre-exist).
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: redline_prometheus
    restart: unless-stopped

    # Publicly reachable (bind to all interfaces)
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - prometheus_data:/prometheus

    # Write config + alert rules to /tmp at startup, then exec the real binary.
    # prom/prometheus is busybox-based so /bin/sh and /tmp are available.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/prometheus.yml << 'PROMEOF'
        global:
          scrape_interval:     15s
          evaluation_interval: 15s
          scrape_timeout:      10s
          external_labels:
            monitor: "redline"
        rule_files:
          - "/tmp/redline.rules"
        scrape_configs:
          - job_name: "redline"
            static_configs:
              - targets: ["redline:8000"]
            metrics_path: "/metrics"
          - job_name: "prometheus"
            static_configs:
              - targets: ["localhost:9090"]
        PROMEOF

        cat > /tmp/redline.rules << 'RULESEOF'
        groups:
          - name: redline
            rules:

              # ── Verfügbarkeit ─────────────────────────────────────────
              - alert: AppDown
                expr: up{job="redline"} == 0
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "Redline App nicht erreichbar"
                  description: "Prometheus kann /metrics nicht mehr scrapen – Container wahrscheinlich down."

              - alert: DatabaseDown
                expr: redline_db_up == 0
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "Datenbank nicht erreichbar"
                  description: "SQLite DB kann nicht geöffnet werden – /healthz schlägt fehl."

              # ── HTTP-Fehler ───────────────────────────────────────────
              - alert: HighErrorRate
                expr: |
                  rate(flask_http_request_total{status=~"5.."}[5m])
                  /
                  rate(flask_http_request_total[5m])
                  > 0.05
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: "Hohe HTTP-5xx-Fehlerrate"
                  description: "Mehr als 5 % der Anfragen der letzten 5 min geben HTTP 5xx zurück."

              - alert: RateLimitHits
                expr: rate(flask_http_request_total{status="429"}[5m]) > 0.5
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Viele Rate-Limit-Treffer (HTTP 429)"
                  description: "Mehr als 0,5 abgelehnte Anfragen pro Sekunde – möglicher Angriff oder Fehlkonfiguration."

              # ── Performance ───────────────────────────────────────────
              - alert: SlowRequests
                expr: |
                  histogram_quantile(0.95,
                    rate(flask_http_request_duration_seconds_bucket[5m])
                  ) > 2
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Langsame Antwortzeiten (p95 > 2 s)"
                  description: "95 % der Anfragen dauern länger als 2 Sekunden."

              # ── Business ──────────────────────────────────────────────
              - alert: ManyOpenDefects
                expr: redline_defects_total{state="open"} > 50
                for: 0m
                labels:
                  severity: info
                annotations:
                  summary: "Viele offene Defekte"
                  description: "Aktuell mehr als 50 offene Defekte im System."
        RULESEOF

        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.retention.time=30d \
          --storage.tsdb.path=/prometheus \
          --web.enable-lifecycle \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles

    depends_on:
      redline:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Grafana ───────────────────────────────────────────────────────────────
  # Datasource + dashboard-provider provisioning is written inline at startup
  # into the named volume path so no host bind mounts are required.
  #
  # Grafana dashboard: import grafana/dashboards/redline.json manually via
  #   Dashboards → Import → Upload JSON file  (one-time, persisted in the volume).
  grafana:
    image: grafana/grafana:10.4.2
    container_name: redline_grafana
    restart: unless-stopped

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      # No fallback – GRAFANA_ADMIN_PASSWORD must be set in .env
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin123}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Point provisioning at a path inside the named volume so we can write
      # config files there without needing host bind mounts.
      GF_PATHS_PROVISIONING: "/var/lib/grafana/provisioning"

    volumes:
      - grafana_data:/var/lib/grafana

    # Write provisioning files into the named volume, then exec Grafana's
    # own startup script (/run.sh) which handles the rest of the init.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p \
          /var/lib/grafana/provisioning/datasources \
          /var/lib/grafana/provisioning/dashboards

        cat > /var/lib/grafana/provisioning/datasources/prometheus.yml << 'GRAFEOF'
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: redline-prometheus
            type: prometheus
            access: proxy
            url: http://prometheus:9090
            isDefault: true
            editable: false
            jsonData:
              httpMethod: GET
              timeInterval: "15s"
        GRAFEOF

        cat > /var/lib/grafana/provisioning/dashboards/provider.yml << 'GRAFEOF'
        apiVersion: 1
        providers:
          - name: "Redline"
            orgId: 1
            folder: "Redline"
            type: file
            disableDeletion: false
            editable: true
            updateIntervalSeconds: 30
            options:
              path: /var/lib/grafana/dashboards
        GRAFEOF

        exec /run.sh

    depends_on:
      - prometheus

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ---------------------------------------------------------------------------
# Named volumes – data persists across container restarts
# ---------------------------------------------------------------------------

volumes:
  redline_data:
    driver: local
  redline_qrcodes:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
