<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redline API – Dokumentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; background: #f2f2f7; font-family: -apple-system, sans-serif; }
    .topbar { background: #cc0000 !important; }
    .topbar-wrapper img { display: none; }
    .topbar-wrapper::before {
      content: "● Redline API";
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      padding: 0 16px;
    }
    .swagger-ui .info .title { color: #cc0000; }
  </style>
</head>
<body>
  <!-- Back navigation bar -->
  <div style="background:#1a1a1a;padding:10px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:9999;">
    <a href="/" style="color:#fff;font-size:14px;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:6px;">
      &#8592; Zurück zur Hauptseite
    </a>
    <span style="color:#444;">|</span>
    <span style="color:#E30613;font-size:14px;font-weight:700;letter-spacing:.5px;">REDLINE</span>
    <span style="color:#666;font-size:14px;">REST API – Dokumentation</span>
    <span style="margin-left:auto;background:#E30613;color:#fff;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:700;">api_user</span>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: "/static/openapi.yaml",
      dom_id: "#swagger-ui",
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: "BaseLayout",
      deepLinking: true,
      displayRequestDuration: true,
      defaultModelsExpandDepth: 1,
      defaultModelExpandDepth: 2,
    });
  </script>
</body>
</html>
