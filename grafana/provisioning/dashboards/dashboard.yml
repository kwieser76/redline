# ---------------------------------------------------------------------------
# Grafana dashboard provisioning – loads JSON files from /var/lib/grafana/dashboards
# ---------------------------------------------------------------------------

apiVersion: 1

providers:
  - name: "Redline"
    orgId: 1
    folder: "Redline"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
