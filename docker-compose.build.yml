# ---------------------------------------------------------------------------
# Redline – local build overlay
#
# Use this overlay when you want to build the image locally instead of
# pulling from GitHub Container Registry (GHCR).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# ---------------------------------------------------------------------------

services:
  redline:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: redline:latest
