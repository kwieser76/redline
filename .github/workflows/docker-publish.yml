# ---------------------------------------------------------------------------
# Redline – GitHub Actions: Build & push Docker image to GHCR
#
# Triggered automatically on every push to main/master.
# Can also be run manually via GitHub → Actions → "Build and push Docker image"
#
# The built image is published to:
#   ghcr.io/kwieser76/redline-:latest
#
# Hostinger HPanel then pulls this image without needing to build locally.
#
# First-time setup (do this once in GitHub):
#   1. Go to https://github.com/kwieser76/Redline-/packages
#   2. Click the "redline-" package → Package settings
#   3. Set visibility to PUBLIC  ← required for Hostinger to pull without auth
# ---------------------------------------------------------------------------

name: Build and push Docker image

on:
  push:
    branches:
      - main
      - master
      - Redline-main
  workflow_dispatch:   # allows manual trigger from GitHub → Actions tab

env:
  REGISTRY: ghcr.io
  # github.repository is "kwieser76/Redline-" → GHCR lowercases it automatically
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      # 1. Check out the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx for multi-platform builds (optional but good practice)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Generate Docker image tags and labels
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # always push latest (used by Hostinger to pull the current image)
            type=raw,value=latest
            # short git SHA tag for traceability (e.g. "sha-abc1234")
            type=sha,prefix=sha-

      # 5. Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime        # uses the "runtime" stage from the multi-stage Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha   # use GitHub Actions cache to speed up builds
          cache-to: type=gha,mode=max
